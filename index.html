<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Glass Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Экран входа -->
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <div class="login-icon" style="font-size: 60px; margin-bottom: 20px;">✨</div>
    <h1>Glass Chat</h1>
    <p>Введите ваш ник, чтобы продолжить</p>
    <div class="input-wrap">
      <label>ВАШ НИК</label>
      <input type="text" id="nickInput" placeholder="Имя" maxlength="20" autofocus>
    </div>
    <button onclick="login()">Войти</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- Основной интерфейс -->
<div id="appScreen" class="app-screen" style="display:none;">
  
  <aside class="server-list">
    <div class="server-item home active" title="Главная">🏠</div>
    <div class="separator"></div>
    <div id="roomListContainer" class="room-list-container"></div>
    <div class="server-item add-room" onclick="showCreateRoom()" title="Создать комнату">+</div>
  </aside>

  <aside class="channel-sidebar">
    <div class="channel-header" id="currentRoomName">Выберите комнату</div>
    
    <div class="channel-section">
      <div class="channel-title">УЧАСТНИКИ — <span id="onlineCount">0</span></div>
      <ul id="onlineList" class="user-list"></ul>
    </div>

    <div class="user-panel">
      <div class="user-panel-avatar" id="myAvatar">?</div>
      <div class="user-panel-info">
        <div class="user-panel-name" id="myName"></div>
        <div class="user-panel-status">В сети</div>
      </div>
      <button class="btn-notify" onclick="requestNotifications()" title="Включить уведомления">🔔</button>
      <button class="btn-leave" onclick="logout()" title="Выйти">⏻</button>
    </div>
  </aside>

  <main class="chat-main">
    <div id="chatPlaceholder" class="chat-placeholder">
      <div class="placeholder-icon">💬</div>
      <h2>Добро пожаловать!</h2>
      <p>Выберите комнату слева или создайте новую.</p>
    </div>

    <div id="activeChat" class="active-chat" style="display:none;">
      <header class="chat-header">
        <div class="chat-header-name"><span class="hash">#</span> <span id="headerRoomName"></span></div>
      </header>

      <div class="messages" id="messages"></div>
      
      <!-- Блок ответа (скрыт по умолчанию) -->
      <div id="replyBlock" class="reply-block" style="display:none;">
        <div class="reply-content">
          <span class="reply-label">Ответ на:</span>
          <span id="replyText"></span>
        </div>
        <button class="reply-close" onclick="cancelReply()">✕</button>
      </div>

      <div class="typing-indicator" id="typing"></div>
      
      <div class="input-bar">
        <button id="micBtn" class="btn-mic" title="Записать голосовое" onclick="toggleRecording()">🎤</button>
        <div class="input-wrap">
          <input type="text" id="msgInput" placeholder="Написать сообщение..." maxlength="1000">
        </div>
        <button onclick="sendMessage()" class="btn-send" title="Отправить">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </main>
</div>

<!-- Модальное окно создания комнаты -->
<div id="createRoomModal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <h2>Создать комнату</h2>
    <p>Дайте вашей комнате имя.</p>
    <div class="input-wrap">
      <label>НАЗВАНИЕ КОМНАТЫ</label>
      <input type="text" id="newRoomInput" placeholder="например: Игровая" maxlength="30">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="hideCreateRoom()">Отмена</button>
      <button class="btn-create" onclick="createRoom()">Создать</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
let socket = null;
let myName = '';
let currentRoom = '';
let mediaRecorder = null;
let audioChunks = [];
let replyToMsg = null; // Для ответа
let messageQueue = []; // Очередь сообщений при обрыве

function makeAvatar(name) {
  const initials = name.trim().slice(0, 2).toUpperCase();
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  const hue = Math.abs(hash) % 360;
  return { text: initials, color: `hsl(${hue}, 60%, 50%)` };
}

window.onload = () => {
  const savedName = localStorage.getItem('chat_username');
  if (savedName) {
    document.getElementById('nickInput').value = savedName;
    login();
  }
};

function login() {
  const nick = document.getElementById('nickInput').value.trim();
  const err = document.getElementById('loginError');
  if (!nick) { err.textContent = 'Введите ник'; return; }

  myName = nick;
  localStorage.setItem('chat_username', myName);
  err.textContent = '';
  
  socket = io({
    transports: ['polling', 'websocket'],
    reconnection: true,
    reconnectionAttempts: Infinity,
  });

  socket.on('connect', () => {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'flex';
    document.getElementById('myName').textContent = myName;
    const av = makeAvatar(myName);
    const myAv = document.getElementById('myAvatar');
    myAv.textContent = av.text;
    myAv.style.background = av.color;
    
    // Отправляем сообщения из очереди
    flushQueue();
  });

  // Отключение
  socket.on('disconnect', () => {
    addSystemMessage("Соединение с сервером потеряно. Попытка переподключения...");
  });

  socket.on('roomList', (list) => {
    const container = document.getElementById('roomListContainer');
    container.innerHTML = '';
    list.forEach(room => {
      const div = document.createElement('div');
      div.className = 'server-item';
      if (room.name === currentRoom) div.classList.add('active');
      div.title = room.name;
      div.textContent = room.name.charAt(0).toUpperCase();
      div.onclick = () => enterRoom(room.name);
      container.appendChild(div);
    });
  });

  socket.on('history', (messages) => {
    document.getElementById('chatPlaceholder').style.display = 'none';
    document.getElementById('activeChat').style.display = 'flex';
    document.getElementById('headerRoomName').textContent = currentRoom;
    document.getElementById('currentRoomName').textContent = currentRoom;

    const box = document.getElementById('messages');
    box.innerHTML = '';
    messages.forEach(msg => renderMessage(msg, true));
    scrollToBottom();
  });

  socket.on('message', (msg) => { 
    renderMessage(msg); 
    scrollToBottom(); 
    // Показываем Push-уведомление, если вкладка не активна
    if (document.hidden && Notification.permission === 'granted') {
      new Notification(`Новое сообщение в #${currentRoom}`, {
        body: `${msg.username}: ${msg.text || 'Голосовое сообщение'}`,
        icon: '/favicon.ico'
      });
    }
  });

  // Обновление статуса "Отправлено"
  socket.on('messageDelivered', ({ id }) => {
    const statusEl = document.getElementById(`status-${id}`);
    if (statusEl) {
      statusEl.textContent = '✔️';
      statusEl.style.color = '#22c55e';
      // Удаляем временное сообщение из очереди, если оно было
      messageQueue = messageQueue.filter(m => m.tempId !== id);
    }
  });

  // Обновление реакций
  socket.on('updateReactions', ({ messageId, reactions }) => {
    const container = document.getElementById(`reactions-${messageId}`);
    if (container) renderReactions(container, messageId, reactions);
  });

  socket.on('roomUsers', (users) => {
    document.getElementById('onlineCount').textContent = users.length;
    const list = document.getElementById('onlineList');
    list.innerHTML = '';
    users.forEach(u => {
      const av = makeAvatar(u);
      const li = document.createElement('li');
      li.className = 'user-list-item';
      li.innerHTML = `
        <div class="user-list-avatar" style="background:${av.color}">${av.text}</div>
        <span class="user-list-name">${u === myName ? u + ' (вы)' : u}</span>
      `;
      if (u === myName) li.classList.add('me');
      list.appendChild(li);
    });
  });

  socket.on('typing', ({ username, isTyping }) => {
    const el = document.getElementById('typing');
    if (isTyping) el.textContent = `${username} печатает...`;
    else if (el.textContent.startsWith(username)) el.textContent = '';
  });
}

function logout() {
  localStorage.removeItem('chat_username');
  if (socket) socket.disconnect();
  location.reload();
}

// --- Уведомления ---
function requestNotifications() {
  if (!("Notification" in window)) {
    alert("Ваш браузер не поддерживает уведомления");
    return;
  }
  Notification.requestPermission().then(permission => {
    if (permission === "granted") {
      alert("Уведомления включены!");
    }
  });
}

// --- Комнаты ---
function showCreateRoom() {
  document.getElementById('createRoomModal').style.display = 'flex';
  document.getElementById('newRoomInput').focus();
}

function hideCreateRoom() {
  document.getElementById('createRoomModal').style.display = 'none';
  document.getElementById('newRoomInput').value = '';
}

function createRoom() {
  const name = document.getElementById('newRoomInput').value.trim();
  if (!name) return;
  hideCreateRoom();
  enterRoom(name);
}

function enterRoom(roomName) {
  currentRoom = roomName;
  socket.emit('joinRoom', { username: myName, roomName: roomName });
}

// --- Отправка сообщений (с очередью) ---
function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;

  const tempId = 'temp-' + Date.now();
  const msgData = { 
    text, 
    tempId,
    replyTo: replyToMsg ? replyToMsg.id : null
  };

  // 1. Показываем сообщение сразу (Local Echo)
  renderMessage({ 
    ...msgData, 
    id: tempId, 
    username: myName, 
    time: Date.now(), 
    status: '⏳' // В процессе
  });

  input.value = '';
  cancelReply(); // Сбрасываем ответ
  socket.emit('typing', false);

  // 2. Отправляем на сервер
  if (socket && socket.connected) {
    socket.emit('message', msgData);
  } else {
    // Если нет связи — в очередь
    messageQueue.push(msgData);
    const statusEl = document.getElementById(`status-${tempId}`);
    if (statusEl) {
      statusEl.textContent = '⚠️';
      statusEl.style.color = '#ef4444';
    }
  }
  scrollToBottom();
}

function flushQueue() {
  if (messageQueue.length > 0 && socket && socket.connected) {
    messageQueue.forEach(msg => socket.emit('message', msg));
    messageQueue = [];
  }
}

// --- Ответы на сообщения ---
function setReply(msg) {
  replyToMsg = msg;
  const block = document.getElementById('replyBlock');
  const txt = document.getElementById('replyText');
  block.style.display = 'flex';
  txt.textContent = `${msg.username}: ${msg.text || 'Голосовое'}`;
  document.getElementById('msgInput').focus();
}

function cancelReply() {
  replyToMsg = null;
  document.getElementById('replyBlock').style.display = 'none';
}

// --- Голосовые ---
async function toggleRecording() {
  const micBtn = document.getElementById('micBtn');
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    micBtn.classList.remove('recording');
    micBtn.textContent = '🎤';
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];

    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };

    mediaRecorder.onstop = async () => {
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      const formData = new FormData();
      formData.append('audio', audioBlob, 'voice.webm');

      try {
        const response = await fetch('/upload', { method: 'POST', body: formData });
        const data = await response.json();
        if (data.url && socket) {
          socket.emit('message', { audioUrl: data.url, tempId: 'temp-audio-' + Date.now() });
        }
      } catch (err) {
        alert('Ошибка загрузки: ' + err.message);
      }
      stream.getTracks().forEach(t => t.stop());
    };

    mediaRecorder.start();
    micBtn.classList.add('recording');
    micBtn.textContent = '⏹';
  } catch (err) {
    alert('Нет доступа к микрофону: ' + err.message);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('nickInput').addEventListener('keypress', e => { if (e.key === 'Enter') login(); });
  document.getElementById('newRoomInput').addEventListener('keypress', e => { if (e.key === 'Enter') createRoom(); });
  document.getElementById('msgInput').addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
});

let lastAuthor = null;

// --- Рендер сообщений ---
function renderMessage(msg, isHistory = false) {
  const box = document.getElementById('messages');
  
  if (msg.type === 'system') {
    const div = document.createElement('div');
    div.className = 'msg system';
    div.textContent = msg.text;
    box.appendChild(div);
    return;
  }

  const isMine = msg.username === myName;
  const isSameAuthor = msg.username === lastAuthor && !msg.replyTo;
  const wrapper = document.createElement('div');
  wrapper.className = 'msg-row ' + (isMine ? 'mine' : 'other');
  if (isSameAuthor && !isHistory) wrapper.classList.add('grouped');
  
  const av = makeAvatar(msg.username);
  
  let contentHTML = '';
  if (msg.replyTo) {
    contentHTML += `<div class="reply-preview">↪ Ответ на сообщение</div>`;
  }
  if (msg.text) contentHTML += `<div class="bubble-text"></div>`;
  if (msg.audioUrl) {
    contentHTML += `<div class="bubble-audio"><audio controls preload="none" src="${msg.audioUrl}"></audio></div>`;
  }

  wrapper.innerHTML = `
    <div class="msg-avatar" style="background:${av.color}">${av.text}</div>
    <div class="bubble-container">
      ${!isSameAuthor ? `<div class="bubble-author">${isMine ? 'Вы' : msg.username} <span class="bubble-time">${new Date(msg.time).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'})}</span></div>` : ''}
      <div class="bubble-content-wrapper">
        <div class="bubble-text-content">${contentHTML}</div>
        <div class="bubble-status" id="status-${msg.id || msg.tempId}">${msg.status || ''}</div>
      </div>
      <div class="reactions-container" id="reactions-${msg.id}"></div>
      <div class="msg-actions">
        <button onclick='setReply(${JSON.stringify(msg).replace(/'/g, "&#39;")})'>↪ Ответить</button>
        <button onclick='addReaction("${msg.id}", "❤️")'>❤️</button>
        <button onclick='addReaction("${msg.id}", "👍")'>👍</button>
      </div>
    </div>
  `;
  
  if (msg.text) wrapper.querySelector('.bubble-text').textContent = msg.text;
  box.appendChild(wrapper);
  
  if (msg.id) renderReactions(wrapper.querySelector('.reactions-container'), msg.id, msg.reactions);
  lastAuthor = msg.username;
}

function addReaction(msgId, emoji) {
  if (!msgId || msgId.startsWith('temp-')) return;
  socket.emit('react', { messageId: msgId, emoji });
}

function renderReactions(container, msgId, reactions) {
  container.innerHTML = '';
  if (!reactions) return;
  
  for (const [emoji, users] of Object.entries(reactions)) {
    if (users.length === 0) continue;
    const badge = document.createElement('div');
    badge.className = 'reaction-badge';
    if (users.includes(myName)) badge.classList.add('my-reaction');
    badge.innerHTML = `${emoji} ${users.length}`;
    badge.onclick = () => addReaction(msgId, emoji);
    container.appendChild(badge);
  }
}

function scrollToBottom() {
  const box = document.getElementById('messages');
  box.scrollTop = box.scrollHeight;
}

function addSystemMessage(text) {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg system';
  div.textContent = text;
  box.appendChild(div);
  scrollToBottom();
}
</script>
</body>
</html>
