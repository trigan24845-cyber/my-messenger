<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Glass Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Экран входа -->
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <div class="login-icon" style="font-size: 60px; margin-bottom: 20px;">✨</div>
    <h1>Glass Chat</h1>
    <p>Введите ваш ник, чтобы продолжить</p>
    <div class="input-wrap">
      <label>ВАШ НИК</label>
      <input type="text" id="nickInput" placeholder="Имя" maxlength="20" autofocus>
    </div>
    <button onclick="login()">Войти</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- Основной интерфейс -->
<div id="appScreen" class="app-screen" style="display:none;">
  
  <!-- Левая панель: Список комнат -->
  <aside class="server-list">
    <div class="server-item home active" title="Главная">🏠</div>
    <div class="separator"></div>
    <div id="roomListContainer" class="room-list-container">
      <!-- Комнаты -->
    </div>
    <div class="server-item add-room" onclick="showCreateRoom()" title="Создать комнату">+</div>
  </aside>

  <!-- Вторая панель: Участники -->
  <aside class="channel-sidebar">
    <div class="channel-header" id="currentRoomName">
      Выберите комнату
    </div>
    
    <div class="channel-section">
      <div class="channel-title">УЧАСТНИКИ — <span id="onlineCount">0</span></div>
      <ul id="onlineList" class="user-list"></ul>
    </div>

    <div class="user-panel">
      <div class="user-panel-avatar" id="myAvatar">?</div>
      <div class="user-panel-info">
        <div class="user-panel-name" id="myName"></div>
        <div class="user-panel-status">В сети</div>
      </div>
      <button class="btn-leave" onclick="logout()" title="Выйти">⏻</button>
    </div>
  </aside>

  <!-- Правая часть: Чат -->
  <main class="chat-main">
    <div id="chatPlaceholder" class="chat-placeholder">
      <div class="placeholder-icon">💬</div>
      <h2>Добро пожаловать!</h2>
      <p>Выберите комнату слева или создайте новую.</p>
    </div>

    <div id="activeChat" class="active-chat" style="display:none;">
      <header class="chat-header">
        <div class="chat-header-name"><span class="hash">#</span> <span id="headerRoomName"></span></div>
      </header>

      <div class="messages" id="messages"></div>
      <div class="typing-indicator" id="typing"></div>
      
      <div class="input-bar">
        <button id="micBtn" class="btn-mic" title="Записать голосовое" onclick="toggleRecording()">🎤</button>
        <div class="input-wrap">
          <input type="text" id="msgInput" placeholder="Написать сообщение..." maxlength="1000">
        </div>
        <button onclick="sendMessage()" class="btn-send" title="Отправить">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </main>
</div>

<!-- Модальное окно создания комнаты -->
<div id="createRoomModal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <h2>Создать комнату</h2>
    <p>Дайте вашей комнате имя.</p>
    <div class="input-wrap">
      <label>НАЗВАНИЕ КОМНАТЫ</label>
      <input type="text" id="newRoomInput" placeholder="например: Игровая" maxlength="30">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="hideCreateRoom()">Отмена</button>
      <button class="btn-create" onclick="createRoom()">Создать</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
let socket = null;
let myName = '';
let currentRoom = '';
let mediaRecorder = null;
let audioChunks = [];

function makeAvatar(name) {
  const initials = name.trim().slice(0, 2).toUpperCase();
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  const hue = Math.abs(hash) % 360;
  return {
    text: initials,
    color: `hsl(${hue}, 60%, 50%)`
  };
}

// --- Проверка сохраненного ника при загрузке ---
window.onload = () => {
  const savedName = localStorage.getItem('chat_username');
  if (savedName) {
    document.getElementById('nickInput').value = savedName;
    // Автоматически входим
    login();
  }
};

// --- Вход ---
function login() {
  const nick = document.getElementById('nickInput').value.trim();
  const err = document.getElementById('loginError');
  if (!nick) { err.textContent = 'Введите ник'; return; }
  if (nick.length < 2) { err.textContent = 'Ник слишком короткий'; return; }

  myName = nick;
  localStorage.setItem('chat_username', myName); // Сохраняем ник
  err.textContent = '';
  
  socket = io({
    transports: ['polling', 'websocket'],
    reconnection: true,
    reconnectionAttempts: Infinity,
  });

  socket.on('connect', () => {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'flex';
    
    document.getElementById('myName').textContent = myName;
    const av = makeAvatar(myName);
    const myAv = document.getElementById('myAvatar');
    myAv.textContent = av.text;
    myAv.style.background = av.color;
  });

  socket.on('roomList', (list) => {
    const container = document.getElementById('roomListContainer');
    container.innerHTML = '';
    
    list.forEach(room => {
      const div = document.createElement('div');
      div.className = 'server-item';
      if (room.name === currentRoom) div.classList.add('active');
      div.title = room.name;
      div.textContent = room.name.charAt(0).toUpperCase();
      div.onclick = () => enterRoom(room.name);
      container.appendChild(div);
    });
  });

  socket.on('history', (messages) => {
    document.getElementById('chatPlaceholder').style.display = 'none';
    document.getElementById('activeChat').style.display = 'flex';
    
    document.getElementById('headerRoomName').textContent = currentRoom;
    document.getElementById('currentRoomName').textContent = currentRoom;

    const box = document.getElementById('messages');
    box.innerHTML = '';
    messages.forEach(renderMessage);
    scrollToBottom();
  });

  socket.on('message', (msg) => { renderMessage(msg); scrollToBottom(); });

  socket.on('roomUsers', (users) => {
    document.getElementById('onlineCount').textContent = users.length;
    const list = document.getElementById('onlineList');
    list.innerHTML = '';
    users.forEach(u => {
      const av = makeAvatar(u);
      const li = document.createElement('li');
      li.className = 'user-list-item';
      li.innerHTML = `
        <div class="user-list-avatar" style="background:${av.color}">${av.text}</div>
        <span class="user-list-name">${u === myName ? u + ' (вы)' : u}</span>
      `;
      if (u === myName) li.classList.add('me');
      list.appendChild(li);
    });
  });

  socket.on('typing', ({ username, isTyping }) => {
    const el = document.getElementById('typing');
    if (isTyping) el.textContent = `${username} печатает...`;
    else if (el.textContent.startsWith(username)) el.textContent = '';
  });
}

// --- Выход ---
function logout() {
  localStorage.removeItem('chat_username'); // Удаляем ник при выходе
  if (socket) socket.disconnect();
  location.reload();
}

// --- Комнаты ---
function showCreateRoom() {
  document.getElementById('createRoomModal').style.display = 'flex';
  document.getElementById('newRoomInput').focus();
}

function hideCreateRoom() {
  document.getElementById('createRoomModal').style.display = 'none';
  document.getElementById('newRoomInput').value = '';
}

function createRoom() {
  const name = document.getElementById('newRoomInput').value.trim();
  if (!name) return;
  hideCreateRoom();
  enterRoom(name);
}

function enterRoom(roomName) {
  currentRoom = roomName;
  socket.emit('joinRoom', { username: myName, roomName: roomName });
}

// --- Чат ---
function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!socket || !socket.connected) {
    alert("Соединение потеряно. Обновите страницу (F5).");
    return;
  }
  if (!text) return;
  socket.emit('message', { text: text });
  input.value = '';
  socket.emit('typing', false);
}

// --- Голосовые ---
async function toggleRecording() {
  const micBtn = document.getElementById('micBtn');
  
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    micBtn.classList.remove('recording');
    micBtn.textContent = '🎤';
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];

    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };

    mediaRecorder.onstop = async () => {
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      const formData = new FormData();
      formData.append('audio', audioBlob, 'voice.webm');

      try {
        const response = await fetch('/upload', { method: 'POST', body: formData });
        const data = await response.json();
        if (data.url && socket) {
          socket.emit('message', { audioUrl: data.url });
        }
      } catch (err) {
        alert('Ошибка загрузки: ' + err.message);
      }
      stream.getTracks().forEach(t => t.stop());
    };

    mediaRecorder.start();
    micBtn.classList.add('recording');
    micBtn.textContent = '⏹';
  } catch (err) {
    alert('Нет доступа к микрофону: ' + err.message);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('nickInput').addEventListener('keypress', e => { if (e.key === 'Enter') login(); });
  document.getElementById('newRoomInput').addEventListener('keypress', e => { if (e.key === 'Enter') createRoom(); });
  document.getElementById('msgInput').addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
});

let lastAuthor = null;

function renderMessage(msg) {
  const box = document.getElementById('messages');
  if (msg.type === 'system') {
    const div = document.createElement('div');
    div.className = 'msg system';
    div.textContent = msg.text;
    box.appendChild(div);
    lastAuthor = null;
    return;
  }
  const isMine = msg.username === myName;
  const isSameAuthor = msg.username === lastAuthor;
  const wrapper = document.createElement('div');
  wrapper.className = 'msg-row ' + (isMine ? 'mine' : 'other');
  if (isSameAuthor) wrapper.classList.add('grouped');
  
  const av = makeAvatar(msg.username);
  
  let contentHTML = '';
  if (msg.text) contentHTML += `<div class="bubble-text"></div>`;
  if (msg.audioUrl) {
    contentHTML += `<div class="bubble-audio"><audio controls preload="none" src="${msg.audioUrl}"></audio></div>`;
  }

  wrapper.innerHTML = `
    <div class="msg-avatar" style="background:${av.color}">${av.text}</div>
    <div class="bubble-container">
      ${!isSameAuthor ? `<div class="bubble-author">${isMine ? 'Вы' : msg.username} <span class="bubble-time">${new Date(msg.time).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'})}</span></div>` : ''}
      <div class="bubble-text-content">${contentHTML}</div>
    </div>
  `;
  
  if (msg.text) wrapper.querySelector('.bubble-text').textContent = msg.text;
  box.appendChild(wrapper);
  lastAuthor = msg.username;
}

function scrollToBottom() {
  const box = document.getElementById('messages');
  box.scrollTop = box.scrollHeight;
}
</script>
</body>
</html>
