<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>iMessage Комнаты</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Экран 1: Вход (Ник) -->
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <div class="login-icon">💬</div>
    <h1>Сообщения</h1>
    <p>Введите ваш ник</p>
    <div class="input-wrap">
      <input type="text" id="nickInput" placeholder="Ваш ник" maxlength="20" autofocus>
    </div>
    <button onclick="goToRooms()">Далее</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- Экран 2: Лобби (Список комнат) -->
<div id="lobbyScreen" class="lobby-screen" style="display:none;">
  <div class="login-box" style="max-width: 450px;">
    <div class="login-icon">🏠</div>
    <h1>Выберите комнату</h1>
    <p>Привет, <span id="lobbyNick" style="color:var(--accent); font-weight:bold;"></span>!</p>
    
    <div class="room-list" id="roomListContainer">
      <!-- Сюда будут добавляться комнаты -->
    </div>

    <div style="margin-top: 20px; border-top: 1px solid var(--glass-border); padding-top: 20px;">
      <div class="input-wrap">
        <input type="text" id="newRoomInput" placeholder="Название новой комнаты..." maxlength="30">
      </div>
      <button onclick="createRoom()">Создать комнату</button>
    </div>
  </div>
</div>

<!-- Экран 3: Чат -->
<div id="chatScreen" class="chat-screen" style="display:none;">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>В комнате <span class="badge" id="onlineCount">0</span></h2>
      <div style="font-size: 12px; color: var(--text-muted); margin-top: 5px;" id="currentRoomName">#</div>
    </div>
    <ul id="onlineList"></ul>
    <div style="margin-top: auto; padding: 10px;">
      <button class="btn-leave" style="width:100%;" onclick="leaveRoom()">← Выйти в лобби</button>
    </div>
  </aside>

  <div class="chat-main">
    <header>
      <div class="header-left">
        <div class="logo"># <span id="headerRoomName"></span></div>
      </div>
      <div class="user-info">
        <div class="my-avatar" id="myAvatar">?</div>
        <span id="myName"></span>
      </div>
    </header>

    <section class="chat-area">
      <div class="messages" id="messages"></div>
      <div class="typing-indicator" id="typing"></div>
      
      <div class="input-bar">
        <button id="micBtn" class="btn-mic" title="Записать голосовое" onclick="toggleRecording()">🎤</button>
        <div class="input-wrap">
          <input type="text" id="msgInput" placeholder="Сообщение..." maxlength="1000">
        </div>
        <button onclick="sendMessage()" title="Отправить" class="btn-send">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5M5 12l7-7 7 7"/>
          </svg>
        </button>
      </div>
    </section>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
let socket = null;
let myName = '';
let currentRoom = '';
let mediaRecorder = null;
let audioChunks = [];

function makeAvatar(name) {
  const initials = name.trim().slice(0, 2).toUpperCase();
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  const hue = Math.abs(hash) % 360;
  return {
    text: initials,
    color: `linear-gradient(135deg, hsl(${hue}, 70%, 60%), hsl(${(hue + 40) % 360}, 70%, 50%))`
  };
}

// --- 1. Вход ---
function goToRooms() {
  const nick = document.getElementById('nickInput').value.trim();
  const err = document.getElementById('loginError');
  if (!nick) { err.textContent = 'Введите ник'; return; }
  if (nick.length < 2) { err.textContent = 'Ник слишком короткий'; return; }

  myName = nick;
  err.textContent = '';
  
  // Подключаемся к серверу
  socket = io({
    transports: ['polling', 'websocket'],
    reconnection: true,
    reconnectionAttempts: Infinity,
  });

  socket.on('connect', () => {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('lobbyScreen').style.display = 'flex';
    document.getElementById('lobbyNick').textContent = myName;
  });

  socket.on('roomList', (list) => {
    const container = document.getElementById('roomListContainer');
    container.innerHTML = '';
    
    if (list.length === 0) {
      container.innerHTML = '<p style="color:var(--text-muted); font-size:14px; text-align:center;">Пока нет комнат. Создайте первую!</p>';
      return;
    }

    list.forEach(room => {
      const div = document.createElement('div');
      div.className = 'room-item';
      div.innerHTML = `
        <span style="font-weight:bold; color:#fff;"># ${room.name}</span>
        <span style="color:var(--accent); font-size:12px;">${room.count} чел.</span>
      `;
      div.onclick = () => enterRoom(room.name);
      container.appendChild(div);
    });
  });

  // Обработчики для чата
  socket.on('history', (messages) => {
    document.getElementById('lobbyScreen').style.display = 'none';
    document.getElementById('chatScreen').style.display = 'flex';
    
    document.getElementById('myName').textContent = myName;
    document.getElementById('headerRoomName').textContent = currentRoom;
    document.getElementById('currentRoomName').textContent = `#${currentRoom}`;
    
    const av = makeAvatar(myName);
    const myAv = document.getElementById('myAvatar');
    myAv.textContent = av.text;
    myAv.style.background = av.color;

    const box = document.getElementById('messages');
    box.innerHTML = '';
    messages.forEach(renderMessage);
    scrollToBottom();
  });

  socket.on('message', (msg) => { renderMessage(msg); scrollToBottom(); });

  socket.on('roomUsers', (users) => {
    document.getElementById('onlineCount').textContent = users.length;
    const list = document.getElementById('onlineList');
    list.innerHTML = '';
    users.forEach(u => {
      const av = makeAvatar(u);
      const li = document.createElement('li');
      li.innerHTML = `
        <div class="online-avatar" style="background:${av.color}">${av.text}</div>
        <span class="online-name">${u === myName ? u + ' (вы)' : u}</span>
      `;
      if (u === myName) li.classList.add('me');
      list.appendChild(li);
    });
  });

  socket.on('typing', ({ username, isTyping }) => {
    const el = document.getElementById('typing');
    if (isTyping) el.textContent = `${username} печатает...`;
    else if (el.textContent.startsWith(username)) el.textContent = '';
  });
}

// --- 2. Лобби ---
function createRoom() {
  const input = document.getElementById('newRoomInput');
  const name = input.value.trim();
  if (!name) return;
  input.value = '';
  enterRoom(name);
}

function enterRoom(roomName) {
  currentRoom = roomName;
  socket.emit('joinRoom', { username: myName, roomName: roomName });
}

function leaveRoom() {
  if (socket) socket.disconnect();
  location.reload();
}

// --- 3. Чат ---
function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!socket || !socket.connected) {
    alert("Соединение потеряно. Обновите страницу (F5).");
    return;
  }
  if (!text) return;
  socket.emit('message', { text: text });
  input.value = '';
  socket.emit('typing', false);
}

// --- Запись голосового ---
async function toggleRecording() {
  const micBtn = document.getElementById('micBtn');
  
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    micBtn.classList.remove('recording');
    micBtn.textContent = '🎤';
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];

    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };

    mediaRecorder.onstop = async () => {
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      const formData = new FormData();
      formData.append('audio', audioBlob, 'voice.webm');

      try {
        const response = await fetch('/upload', { method: 'POST', body: formData });
        const data = await response.json();
        if (data.url && socket) {
          socket.emit('message', { audioUrl: data.url });
        }
      } catch (err) {
        alert('Ошибка загрузки: ' + err.message);
      }
      stream.getTracks().forEach(t => t.stop());
    };

    mediaRecorder.start();
    micBtn.classList.add('recording');
    micBtn.textContent = '⏹';
  } catch (err) {
    alert('Нет доступа к микрофону: ' + err.message);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('msgInput');
  const nickInput = document.getElementById('nickInput');
  const newRoomInput = document.getElementById('newRoomInput');
  
  nickInput.addEventListener('keypress', e => { if (e.key === 'Enter') goToRooms(); });
  newRoomInput.addEventListener('keypress', e => { if (e.key === 'Enter') createRoom(); });
  input.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
});

let lastAuthor = null;

function renderMessage(msg) {
  const box = document.getElementById('messages');
  if (msg.type === 'system') {
    const div = document.createElement('div');
    div.className = 'msg system';
    div.textContent = msg.text;
    box.appendChild(div);
    lastAuthor = null;
    return;
  }
  const isMine = msg.username === myName;
  const isSameAuthor = msg.username === lastAuthor;
  const wrapper = document.createElement('div');
  wrapper.className = 'msg-row ' + (isMine ? 'mine' : 'other');
  if (isSameAuthor) wrapper.classList.add('grouped');
  const av = makeAvatar(msg.username);
  
  let contentHTML = '';
  if (msg.text) contentHTML += `<div class="bubble-text"></div>`;
  if (msg.audioUrl) {
    contentHTML += `<div class="bubble-audio"><audio controls preload="none" src="${msg.audioUrl}"></audio></div>`;
  }

  wrapper.innerHTML = `
    <div class="msg-avatar" style="background:${av.color}">${av.text}</div>
    <div class="bubble">
      ${!isSameAuthor ? `<div class="bubble-author">${isMine ? 'Вы' : msg.username}</div>` : ''}
      ${contentHTML}
      <div class="bubble-time">${new Date(msg.time).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'})}</div>
    </div>
  `;
  
  if (msg.text) wrapper.querySelector('.bubble-text').textContent = msg.text;
  box.appendChild(wrapper);
  lastAuthor = msg.username;
}

function scrollToBottom() {
  const box = document.getElementById('messages');
  box.scrollTop = box.scrollHeight;
}
</script>
</body>
</html>
